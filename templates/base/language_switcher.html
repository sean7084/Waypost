{% load i18n %}
{% get_current_language as CURRENT_LANG %}
{# Segmented 中/EN switcher; each form posts its own target-language `next`. #}
{% with stripped=request.get_full_path|slice:"7:" %}
<div class="wp-langswitch" role="group" aria-label="{% trans 'Language' %}">
    <form method="post" action="{% url 'set_language' %}" class="wp-langswitch__form">
        {% csrf_token %}
        <input type="hidden" name="next" value="/zh-cn/{{ stripped }}">
        <button type="submit" name="language" value="zh-cn"
                class="wp-langswitch__opt{% if CURRENT_LANG == 'zh-cn' %} wp-langswitch__opt--active{% endif %}"
                aria-pressed="{% if CURRENT_LANG == 'zh-cn' %}true{% else %}false{% endif %}">中</button>
    </form>
    <form method="post" action="{% url 'set_language' %}" class="wp-langswitch__form">
        {% csrf_token %}
        <input type="hidden" name="next" value="/en-us/{{ stripped }}">
        <button type="submit" name="language" value="en-us"
                class="wp-langswitch__opt{% if CURRENT_LANG == 'en-us' %} wp-langswitch__opt--active{% endif %}"
                aria-pressed="{% if CURRENT_LANG == 'en-us' %}true{% else %}false{% endif %}">EN</button>
    </form>
</div>
{% endwith %}
