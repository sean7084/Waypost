# Test and coverage tooling configuration.
#
# The canonical runner remains Django's own (`python manage.py test`) - the whole
# existing suite is written as `django.test.TestCase` classes and CI uses it.
# pytest-django is configured here so the same tests can also be run through
# pytest for faster selection (`-k`, `--lf`) and coverage reporting.
# See docs/TESTING.md.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "waypost.settings"
# Django projects name their modules `tests.py`, which pytest does not match by default.
python_files = ["tests.py", "test_*.py", "tests_*.py"]
# `-p waypost.pytest_bootstrap` must stay first: it performs the WeasyPrint /
# fontconfig / .env bootstrap before pytest-django calls django.setup().
addopts = "-p waypost.pytest_bootstrap -ra --strict-markers"
norecursedirs = [
    ".git",
    ".venv",
    "logs",
    "media",
    "miniprogram",
    "migrations",
    "node_modules",
    "static",
    "template_files",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "real_data: requires the real Kering dataset on disk (env-gated, skipped by default)",
]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "*/migrations/*",
    "*/node_modules/*",
    ".venv/*",
    "logs/*",
    "media/*",
    "scripts/*",
    "manage.py",
    "conftest.py",
    "compile_translations.py",
    "debug_roles.py",
    "tmp_*",
    "waypost/asgi.py",
    "waypost/wsgi.py",
    "*/apps.py",
]

[tool.coverage.report]
precision = 1
# Ratchet floor. Measured 43.7% on 2026-09-15 (SQLite) with 79 tests. Set to 40
# rather than 43 so the floor survives small backend-dependent variance between
# SQLite (dev) and PostgreSQL (CI); raise it as coverage improves, never lower it.
# See docs/TESTING.md for the ratchet plan.
fail_under = 40
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

# ---------------------------------------------------------------------------
# Linting (ruff)
#
# Correctness-first gate. Every family below catches code that actually breaks
# at runtime, not style preferences:
#   E9   syntax errors
#   F63  invalid comparison / assert mistakes
#   F7   statement-level logic errors (break outside loop, etc.)
#   F82  undefined names (F821) and use-before-assignment (F823)
#   F811 redefinition of an unused name (duplicate method definitions)
#   F541 f-string without placeholders
#
# Adopting exactly this set immediately found three real defects in untested
# code: a NameError in reports/models.py (datetime never imported), an
# UnboundLocalError in accounts/views.py (gettext `_` shadowed by a loop
# variable) and a duplicated User.can_view_audit in accounts/models.py.
# See issues #68, #69, #70.
#
# Deliberately NOT enabled yet - each needs a reviewed pass of its own (#21):
#   F401  89 unused imports; some may be intentional re-exports
#   F841  unused locals; the two in reports/views.py look like a forgotten
#         queryset scope, which needs human judgement rather than deletion
#   I     107 unsorted imports - cosmetic churn, no defect value
# `ruff format` would rewrite 218 of 296 files. That is a separate, deliberate
# one-shot commit because of the git-blame cost, and is not enforced here.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
extend-exclude = [
    "logs",
    "media",
    "migrations",
    "miniprogram",
    "template_files",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F811", "F541"]
