# Waypost - host Nginx site (ams.istore-tech.cn).
#
# Install AFTER the certificate exists. `nginx -t` fails if ssl_certificate points
# at a missing file, and a failed reload leaves the shared Nginx serving nothing -
# which would take the Helpdesk stack down with it. Order is:
#
#   1. issue the certificate (docs/DEPLOYMENT.md, "TLS certificate")
#   2. sudo install -m 644 docker/nginx/waypost.conf /etc/nginx/sites-available/waypost
#   3. sudo ln -s /etc/nginx/sites-available/waypost /etc/nginx/sites-enabled/waypost
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. verify Helpdesk still answers (it shares this Nginx):
#      curl -s -o /dev/null -w '%{http_code}\n' https://admin.helpdesk.istore-tech.cn/admin/login
#
# ---------------------------------------------------------------------------
# Sharing 80/443 with the Helpdesk stack
# ---------------------------------------------------------------------------
# Nginx selects a server block by SNI/Host, so both applications keep the same
# public ports and neither needs its own. Two rules preserve that:
#
#   1. NO `default_server` anywhere in this file. The Helpdesk site owns the
#      bare-IP default on both 80 and 443; a second one fails `nginx -t` with
#      "duplicate default server".
#   2. An exact `server_name` always beats a default server for requests whose
#      Host is ams.istore-tech.cn. That is what moves this hostname off the
#      Helpdesk default block without editing the Helpdesk site at all.
#
# HTTP/2 is deliberately NOT enabled. On Nginx 1.24 (Ubuntu 24.04) `http2` is a
# parameter of `listen`, i.e. a property of the whole 443 socket - turning it on
# here would change the protocol negotiation for the Helpdesk server blocks too.
# Enabling it is a deliberate, separate change to the shared socket.
#
# ---------------------------------------------------------------------------
# What Nginx serves directly, and what it proxies
# ---------------------------------------------------------------------------
# /media/  -> served from the host bind mount. Django cannot serve it in
#             production: `static()` in waypost/urls.py returns an empty list
#             when DEBUG is False.
# /static/ -> NOT served here. WhiteNoise serves it from inside the container
#             with hashed filenames and pre-compressed .gz/.br variants
#             (settings.STORAGES). Aliasing STATIC_ROOT from a host directory
#             would be a small performance win and a second thing to keep in sync
#             on every deploy; revisit only if static latency ever shows up.
# /        -> proxied to Gunicorn on the loopback interface.

upstream waypost_backend {
  server 127.0.0.1:8000;
  keepalive 32;
}

# --- HTTP: ACME challenge, then redirect -----------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name ams.istore-tech.cn;

  # Let's Encrypt HTTP-01 must be answered here, before the redirect below and
  # before the Helpdesk default server can turn it into a 301 to the bare IP -
  # which is precisely how a previous certificate renewal on this host failed.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt-ams;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://ams.istore-tech.cn$request_uri;
  }
}

# --- HTTPS -----------------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name ams.istore-tech.cn;

  # HTTP-01 path (system certbot in /etc/letsencrypt, renewed automatically by
  # the stock certbot.timer):
  ssl_certificate     /etc/letsencrypt/live/ams.istore-tech.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ams.istore-tech.cn/privkey.pem;
  # DNS-01 path (certbot 5.6.0 in sean's manual config dir, renewed by hand or
  # by the AliDNS hooks) - use these two instead if HTTP-01 is intercepted:
  # ssl_certificate     /home/sean/letsencrypt-manual/live/istore-ams/fullchain.pem;
  # ssl_certificate_key /home/sean/letsencrypt-manual/live/istore-ams/privkey.pem;

  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  server_tokens off;

  # Mini-program photo and signature uploads. The API itself rejects any single
  # file over MAX_UPLOAD_SIZE (5 MB, settings.py) with HTTP 400; this bounds the
  # whole multipart body, so a large batch fails fast at the edge instead of
  # being buffered into Gunicorn.
  client_max_body_size 20m;

  # Do NOT add X-Frame-Options here. settings.py already sends DENY, and a second
  # value from Nginx produces two conflicting headers that browsers resolve
  # unpredictably.

  # Inspection reports (.xlsx) and photo archives (.zip) must download rather
  # than render; the mini program opens the absolute URL returned by
  # POST /api/v1/inspections/{id}/report/.
  location /media/inspections/ {
    alias /home/deploy/waypost-data/media/inspections/;
    expires 7d;
    add_header Content-Disposition 'attachment';
  }

  location /media/ {
    alias /home/deploy/waypost-data/media/;
    expires 30d;
  }

  location / {
    proxy_pass http://waypost_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Django depends on this header: it drives SECURE_PROXY_SSL_HEADER, hence
    # request.is_secure(), hence the CSRF Origin comparison. Omit it and every
    # POST - starting with login - fails with 403.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_redirect off;
    # Gunicorn's --timeout is 300s and one xlsx->PDF conversion may take 120s,
    # so the proxy must not give up first.
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }
}
