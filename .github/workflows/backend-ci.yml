name: Backend CI

# NOTE: this workflow intentionally has NO path filter.
#
# Its job ('Django checks + tests') is a REQUIRED status check on `main` - see
# scripts/setup-branch-protection.ps1. A required check that never runs would
# block a pull request forever, so path-filtering a required workflow (e.g.
# ignoring docs/** or miniprogram/**) would make docs-only PRs unmergeable.
# The mini program lint stays path-filtered and is deliberately NOT required.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  django:
    name: Django checks + tests
    runs-on: ubuntu-latest

    # Mirror production: PostgreSQL as the database and Redis as the cache,
    # rather than the SQLite / local-memory defaults used in development.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: waypost_ci
          POSTGRES_USER: waypost
          POSTGRES_PASSWORD: waypost
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Keep DEBUG on so the production fail-fast guards (secret key, field
      # encryption key, WeChat creds) do not block CI.
      DJANGO_DEBUG: 'True'
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: waypost_ci
      DATABASE_USER: waypost
      DATABASE_PASSWORD: waypost
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DJANGO_REDIS_CACHE_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      # requirements-dev.txt includes -r requirements.txt plus pytest/coverage.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Verify no missing migrations
        run: python manage.py makemigrations --check --dry-run

      # `coverage report` enforces the fail_under floor from pyproject.toml, so a
      # coverage regression fails the build. See docs/TESTING.md for the ratchet.
      - name: Run tests with coverage
        run: |
          python -m coverage run manage.py test
          python -m coverage report

  # Separate job so it runs in parallel and reports its own check name. It needs
  # no database, services or Django install - ruff is static analysis only.
  lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Keep this version in sync with requirements-dev.txt.
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.7

      # Correctness-only gate - the rule set is defined under [tool.ruff] in
      # pyproject.toml and the reasoning is documented there. Adopting it found
      # three real defects in untested code: issues #68, #69 and #70.
      - name: Ruff
        run: python -m ruff check .
