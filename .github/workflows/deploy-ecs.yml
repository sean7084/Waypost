name: Deploy to ECS

# Tag-promoted deployment to the production ECS.
#
# Merging a PR to `main` does NOT deploy anything: it only proves the image still
# builds. Production moves when an annotated tag `v*` is pushed, which is the
# release act defined in docs/RELEASE_PROCEDURE.md §4-§5.6. That keeps
# "redeploy the previous release" a well-defined operation and stops work that is
# merely merged from reaching users before it is released.
#
# The deployment logic lives on the host in `docker/bin/ci-deploy.sh`; this
# workflow only opens an SSH session and passes the tag. Keeping it there means
# the exact same script can be run by hand during an incident, with no runner,
# no secrets and no network path through GitHub involved.
#
# Because it lives on the host it can also be *stale* there: nothing reinstalls it
# automatically, so the first deploy after a `docker/bin` change runs the previous
# script. The drift gate below is what turns that from a silent production outage
# into a legible pre-flight failure (blocker 9b).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ECS_DEPLOY_HOST        public IP or DNS name of the ECS
#   ECS_DEPLOY_PORT        SSH port (this host uses 49153, not 22)
#   ECS_DEPLOY_SSH_KEY     private key, whose public half is the ONLY entry in
#                          that account's authorized_keys
#   ECS_DEPLOY_KNOWN_HOSTS `ssh-keyscan -p <port> <host>` output, so the runner
#                          verifies the host key instead of trusting whatever
#                          answers (StrictHostKeyChecking=yes)
#
# Optional repository VARIABLE (not a secret):
#   ECS_DEPLOY_USER        the unprivileged deploy account; defaults to `deploy`.
#                          Deliberately a variable: it is not sensitive, and
#                          registering it as a secret made Actions mask the literal
#                          word "deploy" throughout the logs, which turned step
#                          names into "Run the *** script on the ECS" and the
#                          summary heading into "Waypost production ***".
#   ALLOW_RUNNER_DRIFT     set to 1/true to downgrade the runner-drift gate below to a
#                          warning. It exists for the incident where the host must be
#                          deployed *now* and the reinstall is the thing that is slow -
#                          which is exactly when a silent drift would otherwise be
#                          worked around by hand and never fixed.

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (for example v0.2.0)'
        required: true
        type: string
      reinstall_runner:
        description: 'Install the tag docker/bin/*.sh onto the host instead of failing the drift gate'
        required: false
        type: boolean
        default: false

# One deploy at a time. Cancelling a deploy in progress is how you end up with a
# half-migrated database, so queued runs wait instead.
concurrency:
  group: waypost-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # --- PR gate: does the image still build? --------------------------------
  image-validate:
    name: Docker image builds (dependency stage)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile defaults to the Aliyun mirrors because production builds
      # run on an ECS in cn-heyuan. GitHub-hosted runners are nowhere near that
      # network, so override them back to the upstream mirrors here - otherwise
      # this job spends most of its time waiting on a trans-Pacific route.
      - name: Build the dependency stage
        run: |
          docker build -f docker/Dockerfile --target deps \
            --build-arg APT_MIRROR=deb.debian.org \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple/ \
            --build-arg PIP_TRUSTED_HOST=pypi.org \
            -t waypost-deps-check .

  # --- Tag path: verify, then deploy ---------------------------------------
  preflight:
    name: Pre-deploy checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # WeasyPrint imports its native libraries at module load, and
      # quotations.services is imported during django.setup().
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      # A tag cut from a tree with uncommitted model changes would migrate the
      # production database into a shape no commit can reproduce.
      - name: Verify no missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Ruff
        run: python -m ruff check .

  deploy:
    name: Deploy to production (ECS)
    needs: preflight
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Records the deployment against the repo's `production` environment, so the
    # Environments tab is a deploy history. An approval gate can be added there
    # later without editing this file.
    environment: production
    timeout-minutes: 25
    env:
      # A tag push gives the tag in ref_name; a manual run takes it from the input.
      DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      # Checked out so the drift gate below can hash this tag's `docker/bin` files.
      # For a tag push Actions already has the tag's SHA; a workflow_dispatch picks
      # whatever branch it was dispatched *from*, so the ref is pinned explicitly -
      # otherwise the gate would compare the host against main's runner, not the
      # release's, and pass a deploy of a tag whose script is different.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Refuse to deploy anything that is not a release tag
        run: |
          echo "Requested deploy of: ${DEPLOY_TAG}"
          case "${DEPLOY_TAG}" in
            v*) ;;
            *) echo "::error::'${DEPLOY_TAG}' is not a v* tag. Production deploys are tag-promoted; see docs/RELEASE_PROCEDURE.md §4."
               exit 1 ;;
          esac

      - name: Verify deploy secrets are configured
        env:
          HOST: ${{ secrets.ECS_DEPLOY_HOST }}
          PORT: ${{ secrets.ECS_DEPLOY_PORT }}
          USER_NAME: ${{ vars.ECS_DEPLOY_USER || 'deploy' }}
          KEY: ${{ secrets.ECS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ECS_DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "${HOST}" ]        || missing="${missing} ECS_DEPLOY_HOST"
          [ -n "${PORT}" ]        || missing="${missing} ECS_DEPLOY_PORT"
          [ -n "${KEY}" ]         || missing="${missing} ECS_DEPLOY_SSH_KEY"
          [ -n "${KNOWN_HOSTS}" ] || missing="${missing} ECS_DEPLOY_KNOWN_HOSTS"
          # USER_NAME is not checked: it always resolves, via the repository
          # variable or the `deploy` default.
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository secret(s):${missing}"
            echo "Provisioning steps: docs/DEPLOYMENT.md, 'CI/CD credentials'."
            exit 1
          fi

      - name: Install the deploy SSH key
        env:
          KEY: ${{ secrets.ECS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ECS_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/id_waypost_deploy"
          chmod 600 "${HOME}/.ssh/id_waypost_deploy"
          printf '%s\n' "${KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      # Blocker 9b. The script that performs the deploy lives on the host in
      # /srv/waypost/bin, outside the checkout, and nothing reinstalls it
      # automatically - so the first deploy after any `docker/bin` change runs the
      # *previous* script and fails at whatever step the new one added, looking
      # exactly like a deploy bug. Comparing the hashes turns that into a legible
      # pre-flight failure. It runs after the key is installed and before anything
      # is executed, so a refusal leaves the host untouched.
      #
      # Deliberately a *failure*, not an automatic install, on a plain tag push:
      # replacing the release path's own runner without being asked is a behaviour
      # change to production. Installing is the explicit `reinstall_runner` dispatch
      # option below; `ALLOW_RUNNER_DRIFT` is the incident escape hatch.
      #
      # The ssh flags are repeated from the deploy step because Actions steps get
      # separate shells, so no helper function can be shared between them. Change
      # both or neither.
      - name: Check the host-side runner matches this tag
        env:
          HOST: ${{ secrets.ECS_DEPLOY_HOST }}
          PORT: ${{ secrets.ECS_DEPLOY_PORT }}
          USER_NAME: ${{ vars.ECS_DEPLOY_USER || 'deploy' }}
          ALLOW_DRIFT: ${{ vars.ALLOW_RUNNER_DRIFT }}
          REINSTALL: ${{ inputs.reinstall_runner }}
        run: |
          ssh_run() {
            ssh -i "${HOME}/.ssh/id_waypost_deploy" \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
                -o BatchMode=yes \
                -o ConnectTimeout=20 \
                -p "${PORT}" "${USER_NAME}@${HOST}" "$@"
          }

          # Mode 755: run over SSH by CI. 750: run by cron as the deploy account,
          # because it reads .env. 640: only ever sourced, never executed.
          # These match scripts/deploy-dev-to-ecs.ps1 exactly - the two paths that
          # install these files must not disagree about what they end up as.
          mode_for() {
            case "$1" in
              ci-deploy.sh) printf '0755' ;;
              waypost-backup.sh) printf '0750' ;;
              *) printf '0640' ;;
            esac
          }

          drift=""
          for NAME in ci-deploy.sh _pg_checkpoint.sh waypost-backup.sh; do
            # A tag from before this file existed has nothing to compare: re-dispatching
            # an old tag (the documented way to redeploy a release) must not be refused
            # because the host holds a script that tag never had.
            if [ ! -f "docker/bin/${NAME}" ]; then
              echo "not part of this tag, skipped: ${NAME}"
              continue
            fi
            LOCAL=$(sha256sum "docker/bin/${NAME}" | cut -d' ' -f1)
            REMOTE=$(ssh_run "sha256sum /srv/waypost/bin/${NAME} 2>/dev/null | cut -d' ' -f1" || true)
            if [ "${LOCAL}" = "${REMOTE}" ]; then
              echo "in sync: ${NAME} (${LOCAL})"
            else
              echo "DRIFT: ${NAME} local=${LOCAL} host=${REMOTE:-absent}"
              drift="${drift} ${NAME}"
            fi
          done

          if [ -z "${drift}" ]; then
            exit 0
          fi

          if [ "${REINSTALL}" = "true" ]; then
            for NAME in ${drift}; do
              ssh_run "cat > /srv/waypost/bin/.${NAME}.next" < "docker/bin/${NAME}"
              ssh_run "install -m $(mode_for "${NAME}") /srv/waypost/bin/.${NAME}.next /srv/waypost/bin/${NAME} && rm -f /srv/waypost/bin/.${NAME}.next"
              echo "installed ${NAME} on the host (mode $(mode_for "${NAME}"))"
            done
            exit 0
          fi

          if [ "${ALLOW_DRIFT}" = "1" ] || [ "${ALLOW_DRIFT}" = "true" ]; then
            echo "::warning::Host runner is stale (${drift}) but ALLOW_RUNNER_DRIFT is set - deploying the OLD script."
            echo "This deploys whatever is in /srv/waypost/bin today. Clear the variable as soon as this release is out."
            exit 0
          fi

          echo "::error::The host's runner differs from this tag for:${drift}"
          echo "Nothing has been deployed and the host is unchanged."
          echo
          echo "Fix it by re-dispatching THIS workflow with the reinstall option:"
          echo "    gh workflow run deploy-ecs.yml --ref <this-tag> -f tag=<this-tag> -f reinstall_runner=true"
          echo "or from a checkout of this tag, on the host itself:"
          for NAME in ${drift}; do
            echo "    install -m $(mode_for "${NAME}") docker/bin/${NAME} /srv/waypost/bin/${NAME}"
          done
          echo "docs/RDS_MIGRATION.md and docs/RELEASE_PROCEDURE.md section 11 explain why this gate exists."
          exit 1

      # Plain OpenSSH rather than a third-party action: one less supply-chain
      # dependency holding a private key that can reach production.
      - name: Run the deploy script on the ECS
        env:
          HOST: ${{ secrets.ECS_DEPLOY_HOST }}
          PORT: ${{ secrets.ECS_DEPLOY_PORT }}
          USER_NAME: ${{ vars.ECS_DEPLOY_USER || 'deploy' }}
        run: |
          ssh -i "${HOME}/.ssh/id_waypost_deploy" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -p "${PORT}" "${USER_NAME}@${HOST}" \
              "/srv/waypost/bin/ci-deploy.sh '${DEPLOY_TAG}'"

      - name: Erase the key from the runner
        if: always()
        run: rm -f "${HOME}/.ssh/id_waypost_deploy"

      - name: Deployment summary
        if: always()
        # Contexts are passed in through env instead of being interpolated into the
        # script. Two reasons, one of them learned the hard way:
        #   1. `${github.event_name}` - single brace - is NOT an Actions expression.
        #      Actions leaves it alone, bash then tries to expand it and dies with
        #      "bad substitution". That is how the v0.2.0 release run reported
        #      failure *after* the deploy itself had succeeded: step 5 was green,
        #      this step was red, and the release was live the whole time.
        #   2. Keeping `${{ }}` out of `run:` removes any chance of script injection
        #      through a context value.
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Waypost production deploy"
            echo ""
            echo "- **tag:** \`${DEPLOY_TAG}\`"
            echo "- **trigger:** \`${EVENT_NAME}\` by \`${ACTOR}\`"
            echo "- **result:** \`${JOB_STATUS}\`"
            echo ""
            echo "The host-side log is \`/srv/waypost/backups/deploy.log\`; container logs are"
            echo "\`docker compose logs --tail=200 app\` in \`/srv/waypost/app\`."
          } >> "${GITHUB_STEP_SUMMARY}"
